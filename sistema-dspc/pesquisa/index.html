<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Pesquisa — Sistema DSPC | Academia Lendária</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold-primary: #D4A437;
      --gold-light: #F5C76A;
      --gold-deep: #A07A1F;
      --bg-void: #000000;
      --bg-deep: #050505;
      --bg-surface: #0D0D0D;
      --bg-card: #141414;
      --white: #FFFFFF;
      --text-secondary: #B8B8B8;
      --text-muted: #7A7A7A;
      --border-void: #1A1A1A;
      --border-light: #2E2E2E;
      --border-gold-soft: rgba(212, 164, 55, 0.3);
      --error: #EF4444;
      --font-geist: 'Geist', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-display: 'Orbitron', 'Geist', sans-serif;
    }

    html, body {
      font-family: var(--font-geist);
      background: var(--bg-void);
      color: var(--white);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body {
      position: relative;
      overflow-x: hidden;
    }

    /* Background cinematográfico Lendário */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(212,164,55,0.18) 0%, rgba(212,164,55,0.06) 30%, #000000 70%),
        radial-gradient(circle at 20% 30%, rgba(212,164,55,0.06), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(212,164,55,0.04), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .constellation {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .brand-pill {
      display: inline-block;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-gold-soft);
      border-radius: 9999px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-primary);
      background: rgba(212, 164, 55, 0.05);
    }

    .brand-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #F5C76A 0%, #D4A437 50%, #A07A1F 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 24px rgba(212, 164, 55, 0.3);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
      text-align: center;
    }

    /* Progress */
    .progress {
      margin-bottom: 2.5rem;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
    }

    .progress-count {
      color: var(--gold-primary);
      font-weight: 500;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
    }

    .progress-percent {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      position: relative;
      height: 4px;
      background: var(--bg-card);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: linear-gradient(135deg, #F5C76A 0%, #D4A437 50%, #A07A1F 100%);
      border-radius: 9999px;
      box-shadow: 0 0 16px rgba(212, 164, 55, 0.4);
      width: 4%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-void);
      border-radius: 1rem;
      padding: 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      animation: card-in 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .block-tag {
      display: inline-block;
      align-self: flex-start;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(212, 164, 55, 0.12);
      color: var(--gold-primary);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .question {
      font-size: clamp(1.125rem, 2.5vw, 1.375rem);
      line-height: 1.45;
      font-weight: 500;
      color: var(--white);
    }

    .helper {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: -0.75rem;
    }

    /* Inputs */
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .input, .textarea {
      width: 100%;
      background: var(--bg-deep);
      border: 1px solid var(--border-light);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: var(--white);
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .input::placeholder, .textarea::placeholder {
      color: var(--text-muted);
    }

    .input:focus, .textarea:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(212, 164, 55, 0.15);
    }

    .textarea {
      min-height: 140px;
      resize: vertical;
    }

    .input-error {
      color: var(--error);
      font-size: 0.875rem;
    }

    /* Radio options */
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--bg-deep);
      border: 1px solid var(--border-light);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option:hover {
      border-color: var(--border-gold-soft);
      background: rgba(212, 164, 55, 0.04);
    }

    .option input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .option-mark {
      width: 20px;
      height: 20px;
      border-radius: 9999px;
      border: 1.5px solid var(--border-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .option-mark::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #F5C76A 0%, #D4A437 50%, #A07A1F 100%);
      transform: scale(0);
      transition: transform 0.2s ease;
    }

    .option.selected {
      border-color: var(--gold-primary);
      background: rgba(212, 164, 55, 0.08);
      box-shadow: 0 0 16px rgba(212, 164, 55, 0.15);
    }

    .option.selected .option-mark {
      border-color: var(--gold-primary);
    }

    .option.selected .option-mark::after {
      transform: scale(1);
    }

    .option-label {
      flex: 1;
      font-size: 0.95rem;
      color: var(--white);
    }

    .option-other {
      margin-top: 0.75rem;
    }

    /* Navigation */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      transition: all 0.25s ease;
      min-height: 44px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--gold-primary);
      color: #000;
      border: 2px solid var(--gold-primary);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--gold-light);
      border-color: var(--gold-light);
      box-shadow: 0 0 24px rgba(212, 164, 55, 0.3);
    }

    .btn-primary:disabled {
      background: var(--bg-card);
      color: var(--text-muted);
      border-color: var(--border-light);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--gold-primary);
      border-color: var(--border-gold-soft);
    }

    .btn-ghost:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .bracket-cta {
      color: var(--gold-primary);
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .bracket-cta::before { content: "[ "; }
    .bracket-cta::after { content: " ]"; }

    /* Done */
    .done {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 3rem 1rem;
      animation: card-in 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .done-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, #F5C76A 0%, #D4A437 50%, #A07A1F 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 24px rgba(212, 164, 55, 0.3);
    }

    .done em {
      font-style: italic;
      color: var(--gold-primary);
    }

    .done-text {
      color: var(--text-secondary);
      max-width: 480px;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .done-text strong {
      color: var(--white);
      font-weight: 600;
    }

    /* Pulse loading */
    .pulse {
      display: inline-flex;
      gap: 6px;
    }

    .pulse span {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #000;
      animation: pulse 1.4s infinite ease-in-out both;
    }

    .pulse span:nth-child(1) { animation-delay: -0.32s; }
    .pulse span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .container { padding: 1.5rem 1rem; }
      .card { padding: 1.5rem; }
      .nav { flex-direction: column-reverse; align-items: stretch; }
      .nav .btn { width: 100%; }
    }
  </style>
</head>

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function visibleQuestions() {
      return QUESTIONS.filter((q) => !q.showIf || q.showIf(state.answers));
    }

    function validate(q, value, other) {
      value = (value || '').trim();
      if (q.required && !value) return 'Esse campo é obrigatório.';
      if (q.type === 'email' && value && !EMAIL_RX.test(value)) return 'Coloca um e-mail válido (ex.: voce@email.com).';
      if (q.type === 'tel' && value && value.replace(/\D/g, '').length < 10) return 'Coloca o WhatsApp com DDD.';
      if (q.type === 'radio' && value === 'outro' && !(other || '').trim()) return 'Conta pra gente qual é o "outro".';
      return null;
    }

    function render() {
      const list = visibleQuestions();
      const total = list.length;
      const step = Math.min(state.step, total - 1);
      const q = list[step];
      const progress = Math.round((step / total) * 100);

      document.getElementById('progress-count').textContent =
        String(step + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
      document.getElementById('progress-percent').textContent = progress + '%';
      document.getElementById('progress-fill').style.width = Math.max(progress, 4) + '%';

      const card = document.getElementById('card');
      card.innerHTML = '';

      const tag = document.createElement('span');
      tag.className = 'block-tag';
      tag.textContent = BLOCK_LABELS[q.block];
      card.appendChild(tag);

      const title = document.createElement('h2');
      title.className = 'question';
      title.textContent = q.label;
      card.appendChild(title);

      if (q.helper) {
        const h = document.createElement('p');
        h.className = 'helper';
        h.textContent = q.helper;
        card.appendChild(h);
      }

      const field = document.createElement('div');
      field.className = 'field';
      card.appendChild(field);

      const value = state.answers[q.id] || '';
      const other = state.others[q.id] || '';

      if (q.type === 'textarea') {
        const ta = document.createElement('textarea');
        ta.className = 'textarea';
        ta.placeholder = q.placeholder || '';
        ta.value = value;
        ta.addEventListener('input', (e) => { state.answers[q.id] = e.target.value; clearError(); });
        field.appendChild(ta);
        setTimeout(() => ta.focus(), 50);
      } else if (q.type === 'radio') {
        const opts = document.createElement('div');
        opts.className = 'options';
        opts.setAttribute('role', 'radiogroup');
        q.options.forEach((opt) => {
          const lbl = document.createElement('label');
          lbl.className = 'option' + (value === opt.value ? ' selected' : '');
          lbl.innerHTML = `
            <input type="radio" name="${q.id}" value="${escapeHtml(opt.value)}" ${value === opt.value ? 'checked' : ''}>
            <span class="option-mark" aria-hidden="true"></span>
            <span class="option-label">${escapeHtml(opt.label)}</span>
          `;
          lbl.addEventListener('click', () => {
            state.answers[q.id] = opt.value;
            clearError();
            render();
          });
          opts.appendChild(lbl);
        });
        field.appendChild(opts);

        if (q.allowOther && value === 'outro') {
          const otherInput = document.createElement('input');
          otherInput.className = 'input option-other';
          otherInput.placeholder = 'Conta qual é o outro motivo...';
          otherInput.value = other;
          otherInput.addEventListener('input', (e) => { state.others[q.id] = e.target.value; clearError(); });
          field.appendChild(otherInput);
          setTimeout(() => otherInput.focus(), 50);
        }
      } else {
        const inp = document.createElement('input');
        inp.className = 'input';
        inp.type = q.type;
        inp.placeholder = q.placeholder || '';
        inp.value = value;
        inp.autocomplete = q.type === 'email' ? 'email' : q.type === 'tel' ? 'tel' : q.id === 'nome' ? 'name' : 'off';
        inp.addEventListener('input', (e) => { state.answers[q.id] = e.target.value; clearError(); });
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleNext(); } });
        field.appendChild(inp);
        setTimeout(() => inp.focus(), 50);
      }

      const errEl = document.createElement('span');
      errEl.id = 'error';
      errEl.className = 'input-error';
      errEl.style.display = 'none';
      card.appendChild(errEl);

      const nav = document.createElement('div');
      nav.className = 'nav';
      nav.innerHTML = `
        <button type="button" class="btn btn-ghost" id="btn-back" ${step === 0 || state.submitting ? 'disabled' : ''}>← Voltar</button>
        <button type="button" class="btn btn-primary" id="btn-next" ${state.submitting ? 'disabled' : ''}>
          ${state.submitting ? '<span class="pulse"><span></span><span></span><span></span></span>' : (step === total - 1 ? 'Enviar respostas' : 'Próxima →')}
        </button>
      `;
      card.appendChild(nav);

      document.getElementById('btn-back').addEventListener('click', handleBack);
      document.getElementById('btn-next').addEventListener('click', handleNext);
    }

    function showError(msg) {
      const e = document.getElementById('error');
      if (!e) return;
      e.textContent = msg;
      e.style.display = 'block';
    }

    function clearError() {
      const e = document.getElementById('error');
      if (e) { e.textContent = ''; e.style.display = 'none'; }
    }

    function handleBack() {
      if (state.step === 0) return;
      state.step--;
      clearError();
      render();
    }

    async function handleNext() {
      const list = visibleQuestions();
      const q = list[state.step];
      const err = validate(q, state.answers[q.id], state.others[q.id]);
      if (err) { showError(err); return; }
      if (state.step < list.length - 1) {
        state.step++;
        clearError();
        render();
        return;
      }
      await submit();
    }

    async function submit() {
      state.submitting = true;
      render();

      const payload = {
        respondedAt: new Date().toISOString(),
        answers: {},
        meta: {
          source: 'sistema-dspc/pesquisa',
          userAgent: navigator.userAgent,
          referrer: document.referrer || null,
        },
      };

      QUESTIONS.forEach((q) => {
        if (q.showIf && !q.showIf(state.answers)) return;
        const v = state.answers[q.id];
        if (v === undefined || v === '') return;
        if (q.type === 'radio' && v === 'outro') {
          payload.answers[q.id] = 'outro: ' + ((state.others[q.id] || '').trim());
        } else {
          payload.answers[q.id] = v;
        }
      });

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error('http-' + res.status);
        showDone();
      } catch (err) {
        state.submitting = false;
        render();
        showError('Não rolou enviar agora. Confere sua conexão e tenta de novo em alguns segundos.');
      }
    }

    function showDone() {
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('done-section').classList.remove('hidden');
      const first = (state.answers.nome || '').split(' ')[0].trim() || 'parceiro(a)';
      document.getElementById('done-name').textContent = first;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    render();
  </script>
</body>
</html>
